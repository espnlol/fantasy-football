name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily — stats only change after games are played, so this is plenty during the season.
    - cron: '17 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static data from nflverse
        run: npm run generate-data

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Doesn't fully self-serve, verified: creating a Pages site the first time needs repo-admin rights
          # that a workflow token can't hold even with pages: write ("Resource not accessible by integration").
          # Harmless to leave true, though — it only matters on the very first run, before a human enables
          # Pages once via Settings → Pages → Source → GitHub Actions.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
